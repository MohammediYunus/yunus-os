<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A local command center for your repositories, tasks and assistant.">
  <title>Yunus OS</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/widgets/graph.css">
  <link rel="stylesheet" href="./css/widgets/runtime.css">
  <link rel="stylesheet" href="./css/widgets/initiative.css">
  <link rel="stylesheet" href="./css/widgets/tasks.css">
  <link rel="stylesheet" href="./css/widgets/github.css">
  <link rel="stylesheet" href="./css/widgets/news.css">
  <link rel="stylesheet" href="./css/widgets/hygiene.css">
  <link rel="stylesheet" href="./css/demo.css">
  <link rel="stylesheet" href="./css/connections.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23e8520a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%23060605' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#grid">Skip to workspace</a>
  <div id="boot" aria-hidden="true">
    <div id="boot-inner">
      <div id="boot-logo">YUNUS<em>OS</em> <span class="boot-version">demo</span></div>
      <div id="boot-lines"></div><div id="boot-bar"><i></i></div>
    </div>
  </div>
  <div id="app">
    <header id="topbar">
      <div class="wordmark">
        <div class="tile" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20"><g fill="#060605">
            <circle cx="3" cy="3" r="1.7"/><circle cx="17" cy="3" r="1.7"/>
            <circle cx="5.8" cy="6.5" r="1.7"/><circle cx="14.2" cy="6.5" r="1.7"/>
            <circle cx="10" cy="10" r="1.7"/><circle cx="10" cy="14" r="1.7"/><circle cx="10" cy="17.5" r="1.7"/>
          </g></svg>
        </div>
        <div><h1 class="name">YUNUS<em>OS</em></h1><div class="sub">Your local command center</div></div>
      </div>
      <div id="system-chips" aria-label="Workspace status"></div>
      <button id="workspace-mode" class="demo-badge" type="button" aria-label="Workspace settings">Demo workspace</button>
      <div id="topbar-controls"><button id="refresh" class="ctl-btn" type="button">Refresh</button><button id="connections-open" class="ctl-btn" type="button">Connections</button><button id="assistant-open" class="ctl-btn accent" type="button">Assistant</button><button id="theme-toggle" class="ctl-btn" type="button" title="Cycle dark, light, and system theme" aria-label="Change color theme">Dark</button></div>
      <div id="clock-block"><div id="clock" aria-live="off">--:--:--</div><div id="clock-meta">Local time</div></div>
    </header>
    <div id="welcome-strip" hidden><span>Explore the demo, or connect your own workspace.</span><button id="welcome-connect" class="text-button" type="button">Connect workspace</button><button id="welcome-dismiss" class="text-button muted" type="button">Keep exploring</button></div>
    <div id="load-error" role="status" hidden><span id="load-error-message">Workspace could not load.</span> <button id="retry" type="button">Try again</button></div>
    <main id="grid" tabindex="-1">
      <div class="col" id="col-left"><section class="panel" id="panel-runtime" aria-label="Local runtime"></section><section class="panel" id="panel-initiative" aria-label="Active initiative"></section></div>
      <div class="col" id="col-center"><section class="panel" id="panel-graph" aria-label="Code graph"></section><section class="panel" id="panel-news" aria-label="Activity feed"></section></div>
      <div class="col" id="col-right"><section class="panel" id="panel-tasks" aria-label="Local tasks"></section><section class="panel" id="panel-github" aria-label="GitHub activity"></section></div>
      <div id="row-bottom"><section class="panel" id="panel-hygiene" aria-label="Repo activity"></section></div>
    </main>
    <footer id="footer"><span>Starting local workspace</span></footer>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
